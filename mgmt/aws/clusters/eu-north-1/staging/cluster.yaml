---
# ── TrueHear staging EKS cluster ─────────────────────────────────────────────
# Staging mirrors the intended production topology on smaller hardware
# (truehear-cloud-development README: "mirror prod, lesser hardware"): one
# workload cluster in eu-north-1, three x86 workers across three AZs on the
# CAPA-managed private subnets, encrypted gp3 root disks, IMDSv2 (EKS default
# for AL2023 managed node groups), the same add-on set and platform
# controllers as dev. The `environment` label selects the staging
# FluxInstance ConfigMap (mgmt/aws/addons/flux-apps/flux-instance.yaml).
#
# What differs from prod is only the worker instance type and scaling floor;
# prod has no defined size in the source repo yet (tracked as a placeholder in
# workload/environments/prod/README.md).
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: staging
  namespace: default
  labels:
    fluxcd: enabled
    region: eu-north-1
    environment: staging
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    services:
      cidrBlocks:
        - 172.20.0.0/16
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta2
    kind: AWSManagedControlPlane
    name: staging-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: AWSManagedCluster
    name: eu-north-1-staging
---
# ── EKS Managed Control Plane ────────────────────────────────────────────────
# CAPA reconciles spec.addons as the COMPLETE desired set: an installed
# add-on absent from this list is deleted (pkg/eks/addons/plan.go). Keep
# every add-on the staging cluster needs here, identical to dev so the two
# environments drift only where cluster.yaml says so. eks-pod-identity-agent
# is required by the Pod Identity associations declared in
# mgmt/aws/infrastructure/staging-pod-identity/; aws-ebs-csi-driver binds its
# controller ServiceAccount (ebs-csi-controller-sa) to the
# truehear-staging-ebs-csi role through the association in the same directory
# (the add-on itself is installed without serviceAccountRoleARN, which is the
# IRSA path).
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: AWSManagedControlPlane
metadata:
  name: staging-control-plane
  namespace: default
spec:
  region: eu-north-1
  version: "1.34.6"
  endpointAccess:
    public: true
    private: true
  logging:
    apiServer: true
    audit: true
    authenticator: true
    controllerManager: true
    scheduler: true
  addons:
    - name: vpc-cni
      version: v1.21.1-eksbuild.7
      conflictResolution: overwrite
    - name: coredns
      version: v1.13.2-eksbuild.4
      conflictResolution: overwrite
    - name: kube-proxy
      version: v1.34.6-eksbuild.2
      conflictResolution: overwrite
    - name: eks-pod-identity-agent
      version: v1.4.0-eksbuild.2
      conflictResolution: overwrite
    - name: aws-ebs-csi-driver
      version: v1.66.0-eksbuild.1
      conflictResolution: overwrite
---
# ── Worker pool: 3 x t3.medium across eu-north-1a/b/c ────────────────────────
# The 3-node floor is a hard requirement of the staging stack, not a cost
# choice: Vault's values require one member per zone (podAntiAffinity on
# topology.kubernetes.io/zone) and the RabbitMQ chart requires one member per
# node (podAntiAffinity on kubernetes.io/hostname). Scaling below three
# leaves those StatefulSets Pending. The instance type is the "lesser
# hardware" knob; prod is expected to use a larger type on the same shape.
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: staging-workers
  namespace: default
spec:
  clusterName: staging
  replicas: 3
  template:
    spec:
      clusterName: staging
      bootstrap:
        dataSecretName: ""
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: AWSManagedMachinePool
        name: staging-workers
      version: "1.34.6"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSManagedMachinePool
metadata:
  name: staging-workers
  namespace: default
spec:
  instanceType: t3.medium
  diskSize: 20
  scaling:
    minSize: 3
    maxSize: 4
  amiType: AL2023_x86_64_STANDARD
  capacityType: onDemand
  availabilityZones:
    - eu-north-1a
    - eu-north-1b
    - eu-north-1c
  labels:
    truehear.io/environment: staging
