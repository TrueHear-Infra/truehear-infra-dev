---
# ── TrueHear dev EKS cluster ─────────────────────────────────────────────────
# Ported from truehear-cloud-development (documentation/krops/krops.doc.md,
# services/aws/eks*, ebs-csi, load-balancer-controller): one workload cluster
# in eu-north-1, three x86 workers across three AZs on the CAPA-managed
# private subnets, encrypted gp3 root disks, IMDSv2 (EKS default for AL2023
# managed node groups). The `environment` label selects the dev FluxInstance
# ConfigMap (mgmt/aws/addons/flux-apps/flux-instance.yaml).
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: dev
  namespace: default
  labels:
    fluxcd: enabled
    region: eu-north-1
    environment: dev
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    services:
      cidrBlocks:
        - 172.20.0.0/16
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta2
    kind: AWSManagedControlPlane
    name: dev-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: AWSManagedCluster
    name: eu-north-1-dev
---
# ── EKS Managed Control Plane ────────────────────────────────────────────────
# CAPA reconciles spec.addons as the COMPLETE desired set: an installed
# add-on absent from this list is deleted (pkg/eks/addons/plan.go). Keep
# every add-on the dev cluster needs here. eks-pod-identity-agent is required
# by the Pod Identity associations declared in
# mgmt/aws/infrastructure/dev-pod-identity/; aws-ebs-csi-driver binds its
# controller ServiceAccount (ebs-csi-controller-sa) to the truehear-dev-ebs-csi
# role through the association in the same directory (the add-on itself is
# installed without serviceAccountRoleARN, which is the IRSA path).
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: AWSManagedControlPlane
metadata:
  name: dev-control-plane
  namespace: default
spec:
  region: eu-north-1
  version: "1.34.6"
  endpointAccess:
    public: true
    private: true
  logging:
    apiServer: true
    audit: true
    authenticator: true
    controllerManager: true
    scheduler: true
  addons:
    - name: vpc-cni
      version: v1.21.1-eksbuild.7
      conflictResolution: overwrite
    - name: coredns
      version: v1.13.2-eksbuild.4
      conflictResolution: overwrite
    - name: kube-proxy
      version: v1.34.6-eksbuild.2
      conflictResolution: overwrite
    - name: eks-pod-identity-agent
      version: v1.4.0-eksbuild.2
      conflictResolution: overwrite
    - name: aws-ebs-csi-driver
      version: v1.66.0-eksbuild.1
      conflictResolution: overwrite
---
# ── Worker pool: 3 x t3.medium across eu-north-1a/b/c ────────────────────────
# Matches the Pulumi-era managed node group (min 3, max 4, t3.medium, gp3
# encrypted, IMDSv2). diskSize is the gp3 root volume in GiB; EKS-managed
# node groups on AL2023 encrypt root volumes when the account's EBS
# encryption-by-default is on (verified by the operator, see docs/aws.md).
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: dev-workers
  namespace: default
spec:
  clusterName: dev
  replicas: 3
  template:
    spec:
      clusterName: dev
      bootstrap:
        dataSecretName: ""
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: AWSManagedMachinePool
        name: dev-workers
      version: "1.34.6"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSManagedMachinePool
metadata:
  name: dev-workers
  namespace: default
spec:
  instanceType: t3.medium
  diskSize: 20
  scaling:
    minSize: 3
    maxSize: 4
  amiType: AL2023_x86_64_STANDARD
  capacityType: onDemand
  availabilityZones:
    - eu-north-1a
    - eu-north-1b
    - eu-north-1c
  labels:
    truehear.io/environment: dev
