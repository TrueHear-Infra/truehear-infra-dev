---
# ══════════════════════════════════════════════════════════════════════════════
# ACK S3, RDS, and IAM controllers on the MANAGEMENT cluster.
#
# ACK controllers talk to the AWS API directly; they do not need to run inside
# the account/cluster whose resources they manage. All ACK controllers
# therefore run here, and the per-workload-cluster AWS resources (Bucket,
# DBInstance, reader Role CRs) are declared under
# mgmt/aws/infrastructure/workload-resources/.
#
# These controllers authenticate with the same SOPS-encrypted credential
# pattern used by capa-system (aws-credentials.sops.yaml). The principal
# behind those static credentials needs the union of the former per-controller
# pod-identity role policies (s3, rds, iam, secretsmanager, kms:CreateGrant) —
# see docs/aws-iam.md for the exact actions and the least-privilege trade-off.
#
# The kind management cluster runs on kind (not EKS), so IRSA/Pod Identity is
# not available here; static credentials via SOPS is the established pattern.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ack-iam-chart
  namespace: ack-system
spec:
  interval: 1h
  url: oci://public.ecr.aws/aws-controllers-k8s/iam-chart
  ref:
    tag: "1.9.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ack-iam-controller
  namespace: ack-system
spec:
  interval: 10m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: ack-iam-chart
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    aws:
      # All resources live in eu-north-1.
      region: eu-north-1
      credentials:
        secretName: aws-credentials
        secretKey: credentials
        profile: default
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ack-eks-chart
  namespace: ack-system
spec:
  interval: 1h
  url: oci://public.ecr.aws/aws-controllers-k8s/eks-chart
  ref:
    tag: "1.23.1"
---
# ACK EKS controller: reconciles the PodIdentityAssociation CRs in
# mgmt/aws/infrastructure/dev-pod-identity/ against the dev EKS cluster.
# It never creates clusters or nodegroups here (CAPA owns those); see
# docs/aws-iam.md for the actions the static principal needs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ack-eks-controller
  namespace: ack-system
spec:
  interval: 10m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: ack-eks-chart
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    aws:
      region: eu-north-1
      credentials:
        secretName: aws-credentials
        secretKey: credentials
        profile: default
