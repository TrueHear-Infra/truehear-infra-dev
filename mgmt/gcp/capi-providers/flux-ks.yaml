apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capi-system
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/capi-providers/capi-system
  dependsOn:
    - name: capi-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capg-system
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/capi-providers/capg-system
  dependsOn:
    - name: capi-system
    - name: gcp-vars
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: gcpmanagedclusters.infrastructure.cluster.x-k8s.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: gcpmanagedcontrolplanes.infrastructure.cluster.x-k8s.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: gcpmanagedmachinepools.infrastructure.cluster.x-k8s.io
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gcp-vars
      # kind bootstrap cluster only (wif-federate creates it): sets
      # GCP_WIF_PROVIDER=kind. Listed after gcp-vars so it overrides.
      - kind: ConfigMap
        name: gcp-wif
        optional: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: caaph-system
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/capi-providers/caaph-system
  dependsOn:
    - name: capi-system
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: helmchartproxies.addons.cluster.x-k8s.io
