  resourceRef:
    kind: Project
    external: projects/${GCP_PROJECT}
  role: roles/servicenetworking.networksAdmin
  memberFrom:
    serviceAccountRef:
      name: krops-kcc
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
