---
# ══════════════════════════════════════════════════════════════════════════════
# APIs required by the GCP environment (issue #72). gcp-bootstrap enables the
# same list imperatively (chicken-and-egg: Config Connector cannot enable
# APIs before it can authenticate); KCC adopts the enabled state. The
# deletion-policy: abandon annotation keeps teardown from disabling APIs.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: serviceusage.cnrm.cloud.google.com/v1beta1
kind: Service
metadata:
  name: container.googleapis.com
  namespace: default
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  projectRef:
    external: projects/${GCP_PROJECT}
---
