---
# ══════════════════════════════════════════════════════════════════════════════
# The krops workload identity pool and its GKE-management OIDC provider
# (issue #72). The pool is created imperatively by gcp-bootstrap (KCC adopts
# it); the `mgmt` provider is declared here in Git.
#
# The `kind` provider is deliberately NOT in Git: its JWKS is per-kind-instance
# state uploaded by the wif-federate mise task (the kind cluster's OIDC issuer
# is not internet-reachable, so Google needs the JWKS pushed). KCC does not
# prune undeclared workload identity pool providers, so the kind provider
# survives reconciliation.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMWorkloadIdentityPool
metadata:
  name: krops
  namespace: default
spec:
  location: global
  projectRef:
    external: projects/${GCP_PROJECT}
  displayName: krops workload identity pool
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMWorkloadIdentityPoolProvider
metadata:
  name: mgmt
  namespace: default
spec:
  location: global
  projectRef:
    external: projects/${GCP_PROJECT}
  workloadIdentityPoolRef:
    name: krops
  displayName: krops GKE management cluster
  attributeMapping:
    google.subject: assertion.sub
  attributeCondition: >-
    assertion.sub in ["system:serviceaccount:capg-system:capg-manager",
    "system:serviceaccount:cnrm-system:cnrm-controller-manager"]
  oidc:
    # GKE issuer URL: zonal location + the literal clusterName pinned in
    # clusters/europe-north1/management/cluster.yaml. GKE issues default
    # projected tokens with this URL as audience, so no extra token volume.
    issuerUri: https://container.googleapis.com/v1/projects/${GCP_PROJECT}/locations/${GCP_ZONE}/clusters/krops-europe-north1-management
    allowedAudiences:
      - https://container.googleapis.com/v1/projects/${GCP_PROJECT}/locations/${GCP_ZONE}/clusters/krops-europe-north1-management
