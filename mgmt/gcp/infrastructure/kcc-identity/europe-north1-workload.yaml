---
# ══════════════════════════════════════════════════════════════════════════════
# GKE-native Workload Identity for the workload-cluster Config Connector
# (issue #72): grants roles/iam.workloadIdentityUser to the workload cluster's
# cnrm-controller-manager service account on the krops-kcc GSA. The workload
# cluster's ConfigConnector (workload/gcp-base/kcc/) sets
# googleServiceAccount: krops-kcc@${GCP_PROJECT}.iam.gserviceaccount.com, and
# GKE exchanges the projected token of cnrm-system/cnrm-controller-manager
# against this binding.
# The roles/iam.serviceAccountTokenCreator grant for the human krops-reader GSA
# on the per-cluster data reader GSA is granted workload-side
# (workload/gcp-base/iam/), not here.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: krops-kcc-wi-europe-north1-workload
  namespace: default
spec:
  resourceRef:
    apiVersion: iam.cnrm.cloud.google.com/v1beta1
    kind: IAMServiceAccount
    name: krops-kcc
  role: roles/iam.workloadIdentityUser
  member: serviceAccount:${GCP_PROJECT}.svc.id.goog[cnrm-system/cnrm-controller-manager]
