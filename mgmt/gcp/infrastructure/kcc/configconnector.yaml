---
# Cluster-mode ConfigConnector (issue #72). The operator (kcc-operator)
# creates the cnrm-system reconcilers from this singleton; it reads the WIF
# external_account file (not a key) from the kcc-wif-credentials Secret
# mounted at /var/secrets/google/key.json (GOOGLE_APPLICATION_CREDENTIALS).
# googleServiceAccount (GKE-native Workload Identity) cannot be used because
# this file must also authenticate on the kind bootstrap cluster.
apiVersion: core.cnrm.cloud.google.com/v1beta1
kind: ConfigConnector
metadata:
  name: configconnector.core.cnrm.cloud.google.com
spec:
  mode: cluster
  credentialSecretName: kcc-wif-credentials
  stateIntoSpec: Absent
