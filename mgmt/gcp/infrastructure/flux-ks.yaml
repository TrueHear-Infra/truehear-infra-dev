---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gcp-vars
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/gcp-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capi-operator
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/capi-operator
  dependsOn:
    - name: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kcc-operator
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 10m
  prune: true
  # wait for the operator StatefulSet to be Ready so the kcc Kustomization's
  # ConfigConnector CR lands on a live operator.
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/kcc-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kcc
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 10m
  prune: true
  # No wait: the ConfigConnector CR has no standard ready condition.
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/kcc
  dependsOn:
    - name: kcc-operator
    - name: gcp-vars
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gcp-vars
      # kind bootstrap cluster only (wif-federate creates it): sets
      # GCP_WIF_PROVIDER=kind. Listed after gcp-vars so it overrides.
      - kind: ConfigMap
        name: gcp-wif
        optional: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kcc-identity
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 10m
  prune: true
  # No wait: the KCC-managed CRs (Service, IAM*, IAMWorkloadIdentityPool*)
  # have no standard ready condition; KCC's own actuation is the readiness
  # signal, observed by test-gcp-identity-chain.py and the acceptance run.
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/infrastructure/kcc-identity
  dependsOn:
    - name: kcc
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gcp-vars
