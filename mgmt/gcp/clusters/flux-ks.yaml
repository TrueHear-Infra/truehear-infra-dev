apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: europe-north1
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 20m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/gcp/clusters/europe-north1
  dependsOn:
    - name: capg-system
    - name: gcp-vars
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gcp-vars
