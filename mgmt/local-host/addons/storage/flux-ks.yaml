apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-workload-storage
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./mgmt/local-host/addons/storage
  dependsOn:
    - name: local-workload-cni
  healthChecks:
    - apiVersion: cluster.x-k8s.io/v1beta2
      kind: Cluster
      name: local-workload
      namespace: default
  healthCheckExprs:
    - apiVersion: cluster.x-k8s.io/v1beta2
      kind: Cluster
      current: status.conditions.exists(e, e.type == 'Available' && e.status == 'True')
