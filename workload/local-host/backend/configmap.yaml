apiVersion: v1
kind: ConfigMap
metadata:
  name: truehear-backend-config
  namespace: backend
  labels:
    app.kubernetes.io/name: truehear-backend
    app.kubernetes.io/part-of: truehear-platform
data:
  .env: |
    PORT=8887
    ENVIRONMENT=development
    NODE_ENV=development
    APP_NAME=Truehear-Platform
    DB_HOST=localhost
    DB_PORT=27017
    DB_NAME=truehear
    DB_AUTH_SOURCE=admin
    DB_REPLICA_SET=rs0
    DB_DIRECT_CONNECTION=true
    DB_TEST_NAME=db-test
    DB_STARTUP_RETRIES=2
    DB_STARTUP_MIN_DELAY=500
    DB_STARTUP_MAX_DELAY=5000
    DB_STARTUP_FACTOR=2
    DB_LOG_LABEL=db
    REDIS_MODE=cluster
    REDIS_CLUSTER_ROOT_NODES=redis-0.redis-headless.redis.svc.cluster.local:6379,redis-1.redis-headless.redis.svc.cluster.local:6379,redis-2.redis-headless.redis.svc.cluster.local:6379
    REDIS_HOST=redis.internal
    REDIS_PORT=6379
    REDIS_DATABASE=0
    REDIS_INTEGRATION=1
    REDIS_SECURE_CONNECTION_ENABLED=true
    REDIS_TLS_ENABLED=1
    REDIS_TLS_REJECT_UNAUTHORIZED=1
    REDIS_TLS_SERVERNAME=
    REDIS_TLS_CA_PATH=/etc/truehear/tls/ca.crt
    REDIS_TLS_CERT_PATH=
    REDIS_TLS_KEY_PATH=
    REDIS_CLUSTER_CONNECT_TIMEOUT_MS=25000
    REDIS_MAX_DELAY_MS=2000
    REDIS_MAX_RETRIES=5
    REDIS_BASE_DELAY_MS=100
    RABBITMQ_URL=amqps://rabbitmq.rabbitmq.svc.cluster.local:5671
    RABBITMQ_CA_CRT=/etc/truehear/tls/ca.crt
    RABBITMQ_CLIENT_CRT=
    RABBITMQ_CLIENT_KEY=
    RABBITMQ_TLS_SERVERNAME=rabbitmq.rabbitmq.svc.cluster.local
    RABBITMQ_HEARTBEAT_SECONDS=30
    RABBITMQ_PREFETCH_COUNT=1
    RABBITMQ_PROTOCOL=amqps
    RABBITMQ_HOST=rabbitmq.rabbitmq.svc.cluster.local
    RABBITMQ_PORT=5671
    RABBITMQ_VHOST=truehear
    RABBITMQ_SECURE_CONNECTION_ENABLED=true
    NOTIFICATION_EXCHANGE=notification.exchange
    NOTIFICATION_QUEUE=notification.queue
    NOTIFICATION_DLQ=notification.dlq
    NOTIFICATION_ROUTING_KEY=notification.queue
    NOTIFICATION_DLQ_ROUTING_KEY=notification.dlq
    DB_INTEGRATION=1
    SANITIZE_INTEGRATION=1
    CORS_INTEGRATION=1
    HEADER_INTEGRATION=1
    PHANTOM_INTEGRATION=1
    ROLE_INTEGRATION=1
    PHANTOM_TTL=55
    REFRESH_TOKEN_TTL_DAYS=7
    USER_REFRESH_TOKEN_COOKIE_NAME=truehear_refresh_token
    USER_TRUST_DEVICE_TOKEN_COOKIE_NAME=truehear_trust_device_token
    BOOTH_REFRESH_TOKEN_COOKIE_NAME=truehear_booth_refresh_token
    REFRESH_TOKEN_ROTATE=true
    SALT_ROUNDS=12
    BCRYPT_SALT_ROUNDS=12
    RESET_OTP_EXPIRY_MINUTES=2
    VERIFY_OTP_EXPIRY_MINUTES=2
    KAFKA_ENABLED=1
    KAFKA_BROKERS=kafka-kraft:9092
    KAFKA_CLIENT_ID=truehear-service
    KAFKA_GROUP_ID=tenant-user-index-projector
    KAFKA_SSL=1
    KAFKA_SSL_CA_PATH=/etc/truehear/tls/ca.crt
    KAFKA_SASL_MECHANISM=scram-sha-512
    KAFKA_REPLICATION_FACTOR=1
    KAFKA_PARTITIONS=1
    KAFKA_SSL_REJECT_UNAUTHORIZED=1
    KAFKA_FAIL_FAST=1
    ACCOUNT_CREATED_QUEUE=account_created_queue
    ACCOUNT_CREATED_DLQ=account_created_dlq
    UNIVERSAL_MESSAGE_QUEUE=universal.message.queue
    UNIVERSAL_MESSAGE_DLQ=universal.message.dlq
    EMAIL_QUEUE=email_queue
    EMAIL_DLQ=email_dlq
    SMS_QUEUE=sms_queue
    SMS_DLQ=sms_dlq
    SWAGGER_DEVELOPMENT_URL=http://localhost
    SWAGGER_PRODUCTION_URL=https://localhost
    CORS_ORIGIN=*
    RATE_LIMIT_WINDOW_MS=60000
    RATE_LIMIT_MAX=100
    MAX_FAILED_ATTEMPTS=5
    LOCK_DURATION_MINUTES=1
    ROOT_ADMIN_EMAIL=truehearteam@gmail.com
    ROOT_ADMIN_USERNAME=truehear
    TRUSTED_DEVICE_EXPIRY_DAYS=30
    TRUSTED_DEVICES_TOTAL=30
    VAULT_AUTH_MODE=kubernetes
    VAULT_SECURE_CONNECTION_ENABLED=true
    VAULT_KUBERNETES_ROLE=truehear-backend-dev
    VAULT_KUBERNETES_JWT_PATH=/var/run/secrets/vault/token
    VAULT_CA_CRT=/etc/truehear/tls/ca.crt
    VAULT_CLIENT_CRT=
    VAULT_CLIENT_KEY=
    VAULT_CRL=
    VAULT_KV_MOUNT=secret
    VAULT_TRANSIT_MOUNT=transit
    VAULT_TRANSIT_KEY_NAME=truehear
    VAULT_URL=https://vault.vault.svc.cluster.local:8200
    VAULT_TLS_SERVERNAME=vault.vault.svc.cluster.local
    VAULT_KV_VERSION=v2
    VAULT_REQUEST_TIMEOUT_MS=10000
    VAULT_PATH=app/truehear
    UPLOAD_HOST=http://localhost:8887
    JWT_EXPIRES_IN=7d
    BOOTH_EXPIRES_IN=90d
    JWT_ALGORITHM=HS256
    JWT_ISSUER=truehear
    JWT_AUDIENCE=truehear-users
    SESSION_ACCESS_TOKEN_TTL_SECONDS=900
    SESSION_REFRESH_TOKEN_TTL_SECONDS=604800
    SESSION_PENDING_TOKEN_TTL_SECONDS=800
    SESSION_ACCESS_TOKEN_PREFIX=session:access
    SESSION_REFRESH_TOKEN_PREFIX=session:refresh
    SESSION_PENDING_TOKEN_PREFIX=session:pending
    SESSION_INDEX_PREFIX=session:index
    SESSION_INDEX_LOCK_PREFIX=lock:session:index
    SESSION_INDEX_LOCK_TTL_MS=1500
    TOTP_2FA_SETUP_PREFIX=2fa:setup:totp
    TRUST_DEVICE_TOKEN_TTL_SECONDS=604800
    LOG_LEVEL=debug
    SKIP_PINO_PRETTY=0
    LOG_TO_FILE=0
    LOG_FILE_NAME=server.log
    LOG_REDACT_KEYS=req.headers.authorization,req.headers.cookie,res.headers.set-cookie
    DISABLE_LOGS_IN_TEST=1
    SHOW_CALLER=1
