apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backend
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: vault
    - name: rabbitmq
    - name: redis
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./workload/local-host/backend
  decryption:
    provider: sops
    secretRef:
      name: sops-age
