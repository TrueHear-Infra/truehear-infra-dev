apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rabbitmq
  namespace: rabbitmq
spec:
  interval: 10m
  timeout: 15m
  releaseName: rabbitmq
  chartRef:
    kind: OCIRepository
    name: truehear-rabbitmq-chart
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: rabbitmq
    replicaCount: 3
    vhost: truehear

    oidc:
      enabled: false

    persistence:
      storageClassName: standard
      size: 1Gi

    scheduling:
      requireDistinctNodes: false
