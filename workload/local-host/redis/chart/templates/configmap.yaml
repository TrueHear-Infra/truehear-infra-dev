{{- $name := include "truehear-redis.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "truehear-redis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: truehear-platform
data:
  redis.conf: |
    port 0
    tls-port {{ .Values.service.redisPort }}
    tls-cert-file /etc/redis/tls/tls.crt
    tls-key-file /etc/redis/tls/tls.key
    tls-ca-cert-file /etc/redis/tls/ca.crt
    tls-auth-clients no
    tls-replication yes
    tls-cluster yes

    cluster-enabled yes
    cluster-config-file /data/nodes.conf
    cluster-node-timeout 5000
    cluster-port {{ .Values.service.clusterBusPort }}
    cluster-preferred-endpoint-type hostname

    dir /data
    appendonly yes
    protected-mode yes

    include /etc/redis/auth/redis-auth.conf
{{- if .Values.acl.enabled }}
    include /etc/redis/acl/users.conf
{{- end }}
