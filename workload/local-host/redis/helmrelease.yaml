apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: redis
spec:
  interval: 10m
  timeout: 20m
  releaseName: redis
  chartRef:
    kind: OCIRepository
    name: truehear-redis-cluster-chart
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: redis
    replicaCount: 6

    rollout:
      partition: 0

    persistence:
      storageClassName: standard
      size: 1Gi

    acl:
      enabled: true
      secretName: redis-backend-acl
      secretKey: users.conf
