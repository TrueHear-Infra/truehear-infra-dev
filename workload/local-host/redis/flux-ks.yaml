apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: redis
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 25m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./workload/local-host/redis
  decryption:
    provider: sops
    secretRef:
      name: sops-age
