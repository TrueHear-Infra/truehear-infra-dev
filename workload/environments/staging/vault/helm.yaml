---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hashicorp
  namespace: vault
spec:
  interval: 1h
  url: https://helm.releases.hashicorp.com
---
# HashiCorp Vault, HA Raft, three members, one per availability zone. Values
# are the vendored upstream file (workload/base/vault/values.yaml) read
# through a ConfigMap generated by kustomize below; nothing environment
# specific is needed beyond the label because the values already pin the
# truehear-encrypted-gp3 StorageClass and the vault-tls Secret. Vault must be
# initialised and unsealed by an operator after the first rollout
# (docs/truehear-environments.md).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: vault
      version: "0.34.1"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: vault-values
      valuesKey: values.yaml
