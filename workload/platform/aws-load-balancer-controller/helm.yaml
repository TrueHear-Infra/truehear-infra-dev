---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
spec:
  interval: 1h
  url: oci://public.ecr.aws/eks-charts/aws-load-balancer-controller
  ref:
    tag: "3.5.0"
---
# AWS Load Balancer Controller. Credentials come from EKS Pod Identity: the
# PodIdentityAssociation in mgmt/aws/infrastructure/<env>-pod-identity binds
# ServiceAccount kube-system/aws-load-balancer-controller to the
# truehear-<env>-aws-load-balancer-controller role, so the SA name below is a
# contract with that file. vpcId is set explicitly: pods on EKS managed nodes
# have IMDS hop limit 1 and cannot discover the VPC through the metadata
# service. Bump the IAM Policy CR together with this chart version.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
spec:
  interval: 10m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: aws-load-balancer-controller
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    clusterName: ${EKS_CLUSTER_NAME}
    region: ${AWS_REGION}
    vpcId: ${VPC_ID}
    serviceAccount:
      create: true
      name: aws-load-balancer-controller
    ingressClass: alb
    createIngressClassResource: true
    enableServiceMutatorWebhook: false
    replicaCount: 2
