apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sync root of the TrueHear staging cluster's FluxInstance
# (mgmt/aws/addons/flux-apps/flux-instance.yaml, path workload/eu-north-1-staging).
