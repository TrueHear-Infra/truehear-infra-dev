---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workload/platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: truehear-platform
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workload/environments/staging
  dependsOn:
    - name: platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workload/environments/staging/keycloak
  dependsOn:
    - name: truehear-platform
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      namespace: keycloak
      name: keycloak-postgresql
    - apiVersion: apps/v1
      kind: Deployment
      namespace: keycloak
      name: keycloak
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
# Ready means the StatefulSet rolled out; the Pods stay sealed until an
# operator initialises Vault.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workload/environments/staging/vault
  dependsOn:
    - name: truehear-platform
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      namespace: vault
      name: vault
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
# The HelmRelease is Ready before the cluster-create Job completes; the
# Job's completion is the second signal.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: redis
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 20m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workload/environments/staging/redis
  dependsOn:
    - name: truehear-platform
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      namespace: redis
      name: redis
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rabbitmq
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workload/environments/staging/rabbitmq
  dependsOn:
    - name: truehear-platform
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      namespace: rabbitmq
      name: rabbitmq
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
