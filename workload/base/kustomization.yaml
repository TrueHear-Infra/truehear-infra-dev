apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Environment-neutral roots. Sync roots (workload/eu-north-1-<env>) compose
# these through workload/environments/<env>, never directly. The redis/ and
# rabbitmq/ chart directories and vault/values.yaml are consumed by
# HelmReleases in the overlays and are not kustomize resources.
resources:
  - truehear-platform
  - keycloak
