apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Root reconciled by every workload cluster's Flux instance (via the
# workload/<cluster>/ overlays). Each entry is a component's Flux
# Kustomization; the components hold the TrueHear application layer
# mirrored from TrueHear/truehear-cloud-development
# kubernetes/environments/dev. The AWS resource-provisioning apps that used
# to live here moved to mgmt/aws/infrastructure/ in issue #346.
resources:
  - truehear-platform/flux-ks.yaml
