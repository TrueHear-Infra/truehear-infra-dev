apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgresql
  namespace: keycloak
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: keycloak-postgresql
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: truehear-platform
      spec:
        accessModes:
          - ReadWriteOnce
        # Default local-path exists only where local-path-provisioner is
        # installed (local-host ships it). Cloud environments MUST set
        # KEYCLOAK_STORAGE_CLASS in cluster-vars (e.g. their CSI class);
        # with the default on a cluster without local-path, the PVC stays
        # Pending and keycloak never becomes ready.
        storageClassName: ${KEYCLOAK_STORAGE_CLASS:=local-path}
        resources:
          requests:
            storage: 5Gi
