apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgresql
  namespace: keycloak
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: keycloak-postgresql
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: truehear-platform
      spec:
        accessModes:
          - ReadWriteOnce
        # Upstream dev: truehear-encrypted-gp3 (EBS). local-host ships
        # local-path-provisioner (workload/local-host/local-path-storage).
        storageClassName: ${KEYCLOAK_STORAGE_CLASS:=local-path}
        resources:
          requests:
            storage: 5Gi
