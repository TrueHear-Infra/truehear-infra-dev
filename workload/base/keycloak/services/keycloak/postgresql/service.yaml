apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgresql
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: truehear-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak-postgresql
    app.kubernetes.io/component: database
  ports:
    - name: postgresql
      port: 5432
      protocol: TCP
      targetPort: postgresql
