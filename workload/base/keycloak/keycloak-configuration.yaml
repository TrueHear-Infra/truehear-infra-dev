apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-configuration
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/part-of: truehear-platform
data:
  # Upstream dev: https://auth.dev.truehearkiosk.com (behind the ALB Ingress,
  # not ported). Keycloak fixes every redirect and console URL to this value
  # (KC_HOSTNAME_STRICT below), so it must be the address clients actually
  # resolve. The demo default is the port-forward address from `mise -E
  # local-host run keycloak-port-forward` (https://localhost:8443); the TLS
  # certificate SAN covers localhost. Environments with an ingress or
  # in-cluster consumers set KEYCLOAK_HOSTNAME in cluster-vars to their
  # reachable URL.
  KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:=https://localhost:8443}
  KC_HOSTNAME_STRICT: 'true'
  KC_PROXY_HEADERS: xforwarded
