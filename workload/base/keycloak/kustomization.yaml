apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Keycloak identity provider with its PostgreSQL, mirrored from
# TrueHear/truehear-cloud-development kubernetes/environments/dev/keycloak.
# services/keycloak/{base,postgresql,application} are byte-identical to the
# upstream kubernetes/services/keycloak/ paths. Differences from upstream dev:
#   - keycloak-configuration.yaml and postgresql-storage.patch.yaml carry
#     ${VAR:=default} placeholders for the per-cluster hostname and storage
#     class (Flux postBuild, see flux-ks.yaml) instead of literal dev values.
#   - ingress.yaml (AWS ALB, account-specific ACM/subnet IDs) is not ported.
#   - the four Secrets upstream creates out of band ship here SOPS-encrypted
#     (*.sops.yaml; generated by `mise run keycloak-secrets`).
resources:
  - services/keycloak/base
  - services/keycloak/postgresql
  - services/keycloak/application
  - keycloak-configuration.yaml
patches:
  - path: postgresql-storage.patch.yaml
