apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Keycloak and PostgreSQL, environment-neutral. Hostname ConfigMap, Ingress,
# storage patch and the four Secrets come from workload/environments/<env>/keycloak.
resources:
  - services/keycloak/base
  - services/keycloak/postgresql
  - services/keycloak/application
