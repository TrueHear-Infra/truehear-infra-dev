---
# ══════════════════════════════════════════════════════════════════════════════
# Config Connector (KCC) on the WORKLOAD cluster (issue #72, the management
# side's counterpart in mgmt/gcp/infrastructure/kcc/).
#
# Authentication: GKE-native Workload Identity, no secret. The management
# cluster's KCC granted roles/iam.workloadIdentityUser on the krops-kcc GSA
# to THIS cluster's cnrm-controller-manager service account
# (mgmt/gcp/infrastructure/kcc-identity/europe-north1-workload.yaml), so the
# operator's projected token is minted by GKE directly and the ConfigConnector
# only names the GSA (googleServiceAccount), no credentialSecretName.
#
# configconnector-operator.yaml is the verbatim release bundle, kept
# byte-identical to the management copy by tests/test-kcc-operator-pin.py.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: core.cnrm.cloud.google.com/v1beta1
kind: ConfigConnector
metadata:
  name: configconnector.core.cnrm.cloud.google.com
  namespace: default
spec:
  mode: cluster
  googleServiceAccount: "krops-kcc@${GCP_PROJECT}.iam.gserviceaccount.com"
  stateIntoSpec: Absent
