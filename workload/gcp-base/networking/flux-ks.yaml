---
# ══════════════════════════════════════════════════════════════════════════════
# Flux Kustomization: the workload cluster's Private Service Access range and
# VPC peering (Cloud SQL's private IP peers into the workload VPC through it).
# dependsOn: kcc so the KCC CRDs are Ready first.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: networking
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workload/gcp-base/networking
  dependsOn:
    - name: kcc
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
