---
# ══════════════════════════════════════════════════════════════════════════════
# cert-manager on the workload cluster: KCC's webhooks require it. wait: true
# so the kcc Kustomization only installs once the CA injector is Ready.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./workload/gcp-base/cert-manager
