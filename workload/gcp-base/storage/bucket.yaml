---
# ══════════════════════════════════════════════════════════════════════════════
# Application data bucket (issue #72, the S3 counterpart).
# The S3 posture: no public access (publicAccessPrevention enforced +
# uniformBucketLevelAccess, i.e. ACLs disabled), versioning, soft delete.
# Encryption is Google-managed by default. resourceID is globally unique:
# project number + cluster name (substituted from cluster-vars).
# force-destroy stays false: deleting a bucket with objects fails loudly.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: data
  namespace: default
  annotations:
    cnrm.cloud.google.com/force-destroy: "false"
spec:
  resourceID: "krops-${GCP_PROJECT_NUMBER}-${CLUSTER_NAME}-data"
  location: "${GCP_REGION}"
  storageClass: STANDARD
  uniformBucketLevelAccess: true
  publicAccessPrevention: ENFORCED
  versioning:
    enabled: true
  softDeletePolicy:
    retentionDurationSeconds: 604800
