name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kustomize-build:
    name: Build kustomize overlays
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install kustomize
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sSf --retry 3 --retry-delay 2 -H "Authorization: token ${GITHUB_TOKEN}" "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Build every overlay
        run: |
          fail=0
          for dir in $(find mgmt workload -name kustomization.yaml -exec dirname {} \; | sort -u); do
            echo "==> kustomize build $dir"
            if ! kustomize build "$dir" >/dev/null; then
              echo "    FAILED: $dir" >&2
              fail=1
            fi
          done
          exit $fail

      - name: "Guard: no ACK CRs under workload/ (#411)"
        run: python3 tests/test-ack-cr-placement.py

  renovate-digest-pinning:
    name: Renovate coverage and repo gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The sops-keygen and local-host kubeconfig tests (#423) run mise tasks,
      # so mise and the pinned tools (age, kubectl) must be available here.
      - name: Install mise
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.9.12
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0

      - name: Install Renovate
        run: npm install --global renovate@44.106.0

      - name: Verify only actions join the GitHub Actions group
        run: python3 tests/test-renovate-actions-grouping.py

      - name: Verify Kubernetes version pins share one group
        run: python3 tests/test-renovate-kubernetes-version-grouping.py
      - name: Verify the cluster-api group's boundaries
        run: python3 tests/test-renovate-cluster-api-grouping.py

      - name: Verify cert-manager's chart and images.txt image tags group together (#322)
        run: python3 tests/test-renovate-cert-manager-grouping.py

      - name: Verify cert-manager supports the pinned Kubernetes version (#322)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tests/test-cert-manager-kubernetes-support.py --changed-from "$BASE_SHA"

      - name: Verify Renovate pin coverage for catalog-replaced surfaces
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: python3 tests/test-renovate-coverage.py

      - name: bootstrap.toml cross-check
        run: python3 tests/test-bootstrap-config.py

      - name: sops-keygen prints the public key (#423)
        run: python3 tests/test-sops-keygen-prints-public-key.py

      - name: truehear env secret generator (#4)
        run: python3 tests/test-truehear-env-secrets.py

      - name: workload overlay cross-check (#4)
        run: python3 tests/test-workload-overlays.py

      - name: local-host kubeconfig endpoint is host-only (#423)
        run: python3 tests/test-local-host-kubeconfig-toolbox-endpoint.py

      - name: Docs show toolbox helper runs, not host mise (#423)
        run: python3 tests/test-docs-toolbox-helpers.py

      - name: cert-manager version consistency (#322)
        run: python3 tests/test-cert-manager-version-consistency.py

      - name: ACK CR scope vs documented principal (#411)
        run: python3 tests/test-aws-iam-doc-scope.py

  python-lint:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"

      - name: ruff check (unused imports, subprocess.run check=)
        run: |
          uv sync --locked
          uv run ruff check .

  yaml-lint:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          file_or_dir: mgmt workload
          config_data: |
            extends: default
            ignore: |
              *.sops.yaml
              workload/base/*/chart/templates/
            rules:
              line-length: disable
              document-start: disable
              comments:
                min-spaces-from-content: 1
              indentation:
                spaces: consistent
                indent-sequences: consistent

# no-op: touch to trigger workflow runs on the fork after Actions enable
