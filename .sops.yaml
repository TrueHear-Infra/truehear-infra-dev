# SOPS configuration. Encrypts only the `data`/`stringData` fields of any
# manifest named `*.sops.yaml` under the listed management or local workload
# paths, leaving keys/metadata readable.
#
# The `age` recipient below is a PUBLIC key — safe to commit. The matching
# PRIVATE key lives in `age.agekey` (gitignored) and is loaded into the cluster
# as the `sops-age` secret by bootstrap.sh so Flux can decrypt on reconcile.
#
# To rotate or add recipients, edit this file and run:  mise run sops-updatekeys
creation_rules:
  - path_regex: workload/local-host/.*\.sops\.yaml$
    encrypted_regex: "^(data|stringData)$"
    age: age1rnpytnyvs6r8wcf740tp47wjkcqap6szqnapewuhw3vnytelvcvqwgmv0h
  - path_regex: mgmt/(aws|azure|gcp)/.*\.sops\.yaml$
    encrypted_regex: "^(data|stringData)$"
    age: age1qdn86vl3v58juv4j7gwuz3qu9hjl4fhcpvla39m848cgz3xd44asxa30nv
