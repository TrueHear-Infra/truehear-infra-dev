# SOPS configuration. Encrypts only the `data`/`stringData` fields of any
# manifest named `*.sops.yaml` under mgmt/aws/, mgmt/gcp/ or
# workload/, leaving keys/metadata readable.
#
# The `age` recipient below is a PUBLIC key — safe to commit. The matching
# PRIVATE key lives in `age.agekey` (gitignored) and is loaded into the cluster
# as the `sops-age` secret by the bootstrap so Flux can decrypt on reconcile.
# Workload clusters receive the same secret through the flux-apps
# ClusterResourceSet (mgmt/<env>/addons/flux-apps/).
#
# To rotate or add recipients, edit this file and run:  mise run sops-updatekeys
creation_rules:
  - path_regex: (mgmt/(aws|gcp)|workload)/.*\.sops\.yaml$
    encrypted_regex: "^(data|stringData)$"
    age: age1qdn86vl3v58juv4j7gwuz3qu9hjl4fhcpvla39m848cgz3xd44asxa30nv
